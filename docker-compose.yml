services:

  db:
    image: postgis/postgis:16-3.4
    container_name: rezi_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rezi
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rezi_backend
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/rezi
      SECRET_KEY: ${SECRET_KEY}
      ENV: ${ENV:-production}
      ORANGE_MONEY_TOKEN: ${ORANGE_MONEY_TOKEN:-}
      MTN_MOMO_SUBSCRIPTION_KEY: ${MTN_MOMO_SUBSCRIPTION_KEY:-}
      WAVE_API_KEY: ${WAVE_API_KEY:-}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-http://204.168.229.74:8081}
      APP_URL: ${APP_URL:-http://204.168.229.74:8081}
      PORT: 8000
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        cd /app &&
        alembic upgrade head &&
        uvicorn main:app --host 0.0.0.0 --port 8000
      "

  flutter_app:
    build: ./flutter_app
    container_name: rezi_flutter_app
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    image: nginx:alpine
    container_name: rezi_frontend
    ports:
      - "8081:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - flutter_app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
